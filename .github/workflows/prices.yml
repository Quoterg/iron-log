name: Price update

# Twice a year (M33): rebuild the typical-price table from SCB's latest price index and Open Prices,
# and open a pull request with the result. Reviewed and merged like any other PR. The shelf prices
# themselves (data/prices-base.json) are re-checked by hand about once a year — never here.
# Needs "Allow GitHub Actions to create and approve pull requests" (Settings → Actions → General).
on:
  schedule:
    - cron: '0 6 1 3,9 *' # 1 March and 1 September, 06:00 UTC (after SCB's January/July figures)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # to start CI on the new branch

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; pnpm version from package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Livsmedelsverket's raw commodities rarely change: keep them between runs, so a run fetches
      # only new foods instead of ~5 200 requests.
      - uses: actions/cache@v4
        with:
          path: data/raw/prices/slv-ravaror.json
          key: slv-ravaror-${{ github.run_id }}
          restore-keys: slv-ravaror-

      - name: Fetch SCB's price index, Open Prices and Livsmedelsverket's foods
        run: pnpm data:fetch-prices

      - name: Build the table (fails if coverage drops more than 10 %)
        run: pnpm data:build-prices

      - name: Check it (unit tests include sanity checks of the table)
        run: pnpm test

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data src/lib/prices.json; then
            echo "No change in the table."
            exit 0
          fi
          month=$(node -p "require('./src/lib/prices.json').month")
          branch="prices/$month-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add public/data src/lib/prices.json
          git commit -m "Prices: typical prices for $month"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Prices: typical prices for $month" --body-file data/raw/prices/summary.md
          gh workflow run ci.yml --ref "$branch"
