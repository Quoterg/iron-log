name: Price update

# Twice a year (M33): rebuild the typical-price table from SCB's latest price index and Open Prices,
# and the fruit seasons (M40) from SCB's imports, Eurostat and Jordbruksverket, and open a pull
# request with the result. Reviewed and merged like any other PR. The shelf prices
# themselves (data/prices-base.json) are re-checked by hand about once a year — never here.
# Needs "Allow GitHub Actions to create and approve pull requests" (Settings → Actions → General).
on:
  schedule:
    - cron: '0 6 1 3,9 *' # 1 March and 1 September, 06:00 UTC (after SCB's January/July figures)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # to start CI on the new branch

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; pnpm version from package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Livsmedelsverket's raw commodities rarely change: keep them between runs, so a run fetches
      # only new foods instead of ~5 200 requests.
      - uses: actions/cache@v6
        with:
          path: data/raw/prices/slv-ravaror.json
          key: slv-ravaror-${{ github.run_id }}
          restore-keys: slv-ravaror-

      - name: Fetch SCB's price index, Open Prices and Livsmedelsverket's foods
        run: pnpm data:fetch-prices

      - name: Build the table (fails if coverage drops more than 10 %)
        run: pnpm data:build-prices

      # The fruit seasons (M40) never block the prices: if their sources fail or change shape, the
      # current table is kept and the pull request says so.
      - name: Fetch and build the fruit seasons (SCB imports, Eurostat trade, Jordbruksverket harvests)
        id: fruit
        continue-on-error: true
        run: |
          pnpm data:fetch-fruit
          pnpm data:build-fruit

      - name: Keep the current fruit seasons (their update failed)
        if: steps.fruit.outcome == 'failure'
        run: git checkout -- src/lib/fruit-season.json src/lib/fruit-period.json

      - name: Check it (unit tests include sanity checks of the tables)
        run: pnpm test

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          FRUIT: ${{ steps.fruit.outcome }}
        run: |
          paths="public/data src/lib/prices.json"
          if [ "$FRUIT" = success ]; then paths="$paths src/lib/fruit-season.json src/lib/fruit-period.json"; fi
          if git diff --quiet -- $paths; then
            echo "No change in the tables."
            exit 0
          fi
          month=$(node -p "require('./src/lib/prices.json').month")
          branch="prices/$month-${{ github.run_id }}"
          if [ "$FRUIT" = success ]; then
            title="Prices: typical prices and fruit seasons for $month"
            cat data/raw/fruit/summary.md >> data/raw/prices/summary.md
          else
            title="Prices: typical prices for $month (fruit seasons not updated)"
            printf '\n## Fruit seasons\n\nNot updated: fetch-fruit/build-fruit failed in run %s — the current table is kept.\n' "${{ github.run_id }}" >> data/raw/prices/summary.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add $paths
          git commit -m "$title"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" --body-file data/raw/prices/summary.md
          gh workflow run ci.yml --ref "$branch"
